name: 🎵 Monitor de Conciertos

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      sector_prueba:
        description: "🧪 Sector inventado para probar la alerta (ej: 'Platea VIP'). Déjalo vacío para correr normal."
        type: string
        default: ""

jobs:
  check-tickets:
    name: Chequear disponibilidad
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: 📂 Restaurar estado previo
        uses: actions/cache/restore@v4
        with:
          path: estado_previo.json
          key: tm-estado2-${{ github.run_id }}
          restore-keys: tm-estado2-

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Instalar dependencias
        run: |
          pip install playwright requests
          playwright install chromium --with-deps

      - name: 🔍 Chequear disponibilidad
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SECTOR_PRUEBA:    ${{ inputs.sector_prueba }}
        run: |
          python - <<'PYEOF'
          import os, json, asyncio, requests, re, unicodedata
          from datetime import datetime, timezone, timedelta

          EVENTOS = [
              {
                  "id":               "gorillaz",
                  "nombre":           "Gorillaz Chile 2026 🎸",
                  "url":              "https://www.ticketmaster.cl/event/gorillaz-live-2026-scl-venta-general",
                  "fecha_agotado":    None,
                  "fecha_selector":   None,
                  "sectores_iniciales": {
                      "pit", "pacifico sur", "pacífico sur", "cancha frontal",
                  },
              },
              {
                  "id":               "ironmaiden_31oct_v2",  # v2: ahora usa fecha_selector
                  "nombre":           "Iron Maiden 31 Oct 2026 🤘",
                  "url":              "https://www.ticketmaster.cl/event/iron-maiden-run-for-your-lives-scl-2026-venta-general",
                  "fecha_agotado":    None,
                  "fecha_selector":   "31/10/2026",
                  "sectores_iniciales": set(),
              },
              {
                  "id":               "edsheeran",
                  "nombre":           "Ed Sheeran 2026 🎵",
                  "url":              "https://www.ticketmaster.cl/event/ed-sheeran-loop-tour-2026-scl-venta-general",
                  "fecha_agotado":    None,
                  "fecha_selector":   "21/11/2026",
                  "sectores_iniciales": {
                      "pacifico centro", "pacífico centro",
                      "platea zafiro",
                      "pacifico sur", "pacífico sur",
                      "cancha frontal pacifico", "cancha frontal pacífico",
                      "cancha frontal andes",
                      "platea royal", "platea baja",
                      "cancha general", "movilidad reducida",
                  },
              },
              {
                  "id":               "foofighters",
                  "nombre":           "Foo Fighters 2027 🤘",
                  "url":              "https://www.ticketmaster.cl/event/foo-fighters-live-2027-scl-venta-general",
                  "fecha_agotado":    None,
                  "fecha_selector":   None,
                  "sectores_iniciales": set(),
              },
              {
                  "id":               "bts_17oct",
                  "nombre":           "BTS 17 Oct 2026 🎤",
                  "url":              "https://www.ticketmaster.cl/event/bts-world-tour-arirang-live-2026-scl-venta-general-17-de-octubre",
                  "fecha_agotado":    None,
                  "fecha_selector":   None,
                  "sectores_iniciales": set(),
              },
          ]

          TELEGRAM_TOKEN   = os.environ.get("TELEGRAM_TOKEN", "")
          TELEGRAM_CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID", "")
          SECTOR_PRUEBA    = os.environ.get("SECTOR_PRUEBA", "").strip()

          def send_telegram(msg: str) -> bool:
              if not TELEGRAM_TOKEN or not TELEGRAM_CHAT_ID:
                  print("  ⚠️  Sin credenciales Telegram")
                  return False
              try:
                  r = requests.post(
                      f"https://api.telegram.org/bot{TELEGRAM_TOKEN}/sendMessage",
                      json={"chat_id": TELEGRAM_CHAT_ID, "text": msg,
                            "parse_mode": "HTML", "disable_web_page_preview": False},
                      timeout=10)
                  r.raise_for_status()
                  print("  ✅ Telegram OK")
                  return True
              except Exception as e:
                  print(f"  ❌ Telegram error: {e}")
                  return False

          def normalizar(texto: str) -> str:
              t = unicodedata.normalize("NFKD", texto.lower())
              return "".join(c for c in t if not unicodedata.combining(c)).strip()

          def _extraer_sectores(lineas: list) -> list:
              """
              Detecta sectores en dos formatos:
                1. "Nombre sector"  →  "Desde $ 160.000"   (formato original Ticketmaster)
                2. "Nombre sector"  →  "$ 160.000 ..."     (formato tabla, fila de precios)
                3. "Nombre sector $ 160.000"               (nombre e precio en la misma línea)
              """
              encontrados = []
              visto = set()

              def agregar(nombre: str):
                  nombre = nombre.strip()
                  if len(nombre) < 3 or len(nombre) > 70:
                      return
                  nl = nombre.lower()
                  if nl.startswith("desde") or nombre.startswith("$"):
                      return
                  # Ignorar líneas que parecen encabezados / metadata
                  if nl in {"ubicacion", "ubicación", "precio", "cargo", "precio final",
                             "precio con dcto", "ver entradas", "comprar", "selecciona"}:
                      return
                  k = normalizar(nombre)
                  if k not in visto:
                      visto.add(k)
                      encontrados.append(nombre)

              for i, linea in enumerate(lineas):
                  l = linea.strip()
                  ll = l.lower().replace(" ", "")

                  # Patrón 1: "Desde $NNN" → nombre en línea anterior
                  if "desde$" in ll and any(c.isdigit() for c in l):
                      if i > 0:
                          agregar(lineas[i-1])
                      continue

                  # Patrón 2: línea comienza con "$ NNN" (fila de tabla de precios)
                  if re.match(r'^\$\s*[\d]', l):
                      if i > 0:
                          prev = lineas[i-1].strip()
                          if not prev.startswith("$") and not re.match(r'^\d', prev):
                              agregar(prev)
                      continue

                  # Patrón 3: "Nombre Sector $ 160.000" en la misma línea
                  m = re.match(
                      r'^([A-Za-záéíóúÁÉÍÓÚñÑüÜ][^\$]{2,55}?)\s+\$\s*[\d]',
                      l)
                  if m:
                      nombre_inline = m.group(1).strip()
                      if not nombre_inline.lower().startswith("desde"):
                          agregar(nombre_inline)

              return encontrados

          async def seleccionar_fecha(page, fecha: str) -> bool:
              print(f"  🗓  Seleccionando fecha: '{fecha}'")
              for sel in [
                  "text=Selecciona la función", "[class*='dropdown']",
                  "[class*='select']", "[class*='function']", "[class*='arrow']",
              ]:
                  try:
                      el = page.locator(sel).first
                      if await el.is_visible(timeout=2000):
                          await el.click()
                          await asyncio.sleep(2)
                          break
                  except Exception:
                      continue
              for sel in [
                  f"text={fecha}",
                  f"[class*='option']:has-text('{fecha}')",
                  f"li:has-text('{fecha}')",
              ]:
                  try:
                      el = page.locator(sel).first
                      if await el.is_visible(timeout=2000):
                          await el.click()
                          await asyncio.sleep(4)
                          print(f"  ✅ Fecha seleccionada: {fecha}")
                          return True
                  except Exception:
                      continue
              try:
                  await page.get_by_text(fecha, exact=False).first.click()
                  await asyncio.sleep(4)
                  print(f"  ✅ Fecha seleccionada (fallback): {fecha}")
                  return True
              except Exception as e:
                  print(f"  ⚠️  No se pudo seleccionar '{fecha}': {e}")
                  return False

          async def abrir_dropdown_agotado(page) -> bool:
              for sel in [
                  "text=Selecciona la función", "[class*='dropdown']",
                  "[class*='select']", "[class*='arrow']",
              ]:
                  try:
                      el = page.locator(sel).first
                      if await el.is_visible(timeout=2000):
                          await el.click()
                          await asyncio.sleep(2)
                          return True
                  except Exception:
                      continue
              try:
                  await page.get_by_text("Selecciona", exact=False).first.click()
                  await asyncio.sleep(2)
                  return True
              except Exception:
                  pass
              return False

          async def obtener_sectores(url: str, fecha_agotado, fecha_selector) -> list:
              from playwright.async_api import async_playwright
              sectores = []
              async with async_playwright() as pw:
                  browser = await pw.chromium.launch(
                      headless=True,
                      args=["--no-sandbox", "--disable-dev-shm-usage"])
                  ctx = await browser.new_context(
                      user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                                 "Chrome/124.0.0.0 Safari/537.36",
                      locale="es-CL", timezone_id="America/Santiago",
                      viewport={"width": 1440, "height": 900})
                  page = await ctx.new_page()
                  try:
                      await page.goto(url, wait_until="networkidle", timeout=28000)
                  except Exception:
                      try:
                          await page.goto(url, wait_until="domcontentloaded", timeout=28000)
                      except Exception as e:
                          print(f"  ⚠️  Goto falló: {e}")
                  await asyncio.sleep(5)
                  try:
                      if fecha_agotado:
                          # Primero verificar estado en el dropdown
                          await abrir_dropdown_agotado(page)
                          texto       = await page.inner_text("body")
                          texto_lower = texto.lower()
                          fecha_lower = fecha_agotado.lower()
                          print(f"  Buscando fecha: '{fecha_agotado}'")
                          if fecha_lower in texto_lower:
                              idx      = texto_lower.find(fecha_lower)
                              contexto = texto_lower[max(0, idx-80):idx+80]
                              print(f"  Contexto: ...{contexto.strip()}...")
                              if "agotado" in contexto:
                                  print(f"  🔴 {fecha_agotado} sigue agotado")
                              else:
                                  print(f"  🟢 {fecha_agotado} → DISPONIBLE — leyendo sectores...")
                                  # Intentar seleccionar la fecha para ver su panel
                                  seleccionada = await seleccionar_fecha(page, fecha_agotado)
                                  await asyncio.sleep(3)
                                  texto2  = await page.inner_text("body")
                                  lineas2 = [l.strip() for l in texto2.splitlines() if l.strip()]
                                  print(f"  Líneas tras seleccionar fecha: {len(lineas2)}")
                                  sectores_encontrados = _extraer_sectores(lineas2)
                                  for s in sectores_encontrados:
                                      print(f"  ✅ Sector: '{s}'")
                                  if sectores_encontrados:
                                      sectores.extend(sectores_encontrados)
                                  else:
                                      # Fallback: leer directamente sin re-seleccionar
                                      lineas_raw = [l.strip() for l in texto.splitlines() if l.strip()]
                                      sectores_fb = _extraer_sectores(lineas_raw)
                                      for s in sectores_fb:
                                          print(f"  ✅ Sector (fallback): '{s}'")
                                      if sectores_fb:
                                          sectores.extend(sectores_fb)
                                      else:
                                          sectores.append(f"Fecha habilitada: {fecha_agotado} (sin sectores visibles)")
                          else:
                              print(f"  ⚠️  No se encontró '{fecha_agotado}'")

                      elif fecha_selector:
                          await seleccionar_fecha(page, fecha_selector)
                          texto  = await page.inner_text("body")
                          lineas = [l.strip() for l in texto.splitlines() if l.strip()]
                          print(f"  Página cargada: {len(lineas)} líneas")
                          sectores_enc = _extraer_sectores(lineas)
                          for s in sectores_enc:
                              print(f"  ✅ Sector: '{s}'")
                          sectores.extend(sectores_enc)

                      else:
                          texto  = await page.inner_text("body")
                          lineas = [l.strip() for l in texto.splitlines() if l.strip()]
                          print(f"  Página cargada: {len(lineas)} líneas")
                          sectores_enc = _extraer_sectores(lineas)
                          for s in sectores_enc:
                              print(f"  ✅ Sector: '{s}'")
                          sectores.extend(sectores_enc)
                          if not sectores:
                              texto_lower = texto.lower()
                              if any(p in texto_lower for p in ["agotado", "sold out"]):
                                  print("  🔴 Agotado — sin sectores")
                              else:
                                  print("  ⚠️  Sin sectores detectados")

                  except Exception as e:
                      print(f"  ⚠️  Lectura falló: {e}")
                  await browser.close()
              return sectores

          def cargar_estado() -> dict:
              if os.path.exists("estado_previo.json"):
                  try:
                      with open("estado_previo.json") as f:
                          data = json.load(f)
                          print(f"✅ Estado cargado: {list(data.keys())}")
                          return data
                  except Exception:
                      pass
              print("⚠️  Sin estado previo")
              return {}

          def guardar_estado(estado: dict):
              with open("estado_previo.json", "w") as f:
                  json.dump(estado, f, ensure_ascii=False, indent=2)

          # ══════════════════════════════════════════════════════════════════════
          ahora_utc = datetime.now(timezone.utc)
          hora_scl  = ahora_utc - timedelta(hours=4)

          print("=" * 55)
          print(f"  🎵 {ahora_utc.strftime('%Y-%m-%d %H:%M UTC')} ({hora_scl.strftime('%H:%M')} SCL)")
          if SECTOR_PRUEBA:
              print(f"  🧪 MODO PRUEBA — sector: '{SECTOR_PRUEBA}'")
          print("=" * 55)

          estado_global = cargar_estado()
          estado_nuevo  = {}

          for evento in EVENTOS:
              eid            = evento["id"]
              nombre         = evento["nombre"]
              url            = evento["url"]
              fecha_agotado  = evento.get("fecha_agotado")
              fecha_selector = evento.get("fecha_selector")
              si_norm        = {normalizar(s) for s in evento["sectores_iniciales"]}

              print(f"\n{'─'*55}")
              print(f"  {nombre}")
              print(f"{'─'*55}")

              DESTACADOS = {
                  "cancha general", "pacifico medio", "pacífico medio",
                  "galeria norte", "galería norte",
              }

              ev_estado    = estado_global.get(eid, {})
              es_baseline  = not ev_estado
              # Estado guardado en nombres normalizados → comparación robusta
              panel_prev_norm = set(ev_estado.get("sectores_norm", []))
              # Mapa norm→original para reconstruir nombres bonitos al alertar
              nombre_orig_prev = {n: n for n in ev_estado.get("sectores_panel", [])}
              primer_check     = ev_estado.get("primer_check", ahora_utc.isoformat())

              print(f"  baseline={es_baseline} | panel_prev={sorted(panel_prev_norm) or '(vacío)'}")

              sectores_raw = asyncio.run(obtener_sectores(url, fecha_agotado, fecha_selector))

              # Construir: lista de (nombre_original, nombre_normalizado)
              sectores_pares = [(s, normalizar(s)) for s in sectores_raw]
              # Mapa norm→original para esta corrida
              norm_a_orig = {n: o for o, n in sectores_pares}

              panel_ahora_norm = set(n for _, n in sectores_pares)

              if SECTOR_PRUEBA:
                  n_prueba = normalizar(SECTOR_PRUEBA)
                  panel_ahora_norm.add(n_prueba)
                  norm_a_orig[n_prueba] = SECTOR_PRUEBA
                  print(f"  🧪 Inyectado: '{SECTOR_PRUEBA}'")

              print(f"  Panel ahora: {sorted(panel_ahora_norm) or '(vacío)'}")

              if es_baseline:
                  print("  📌 Baseline guardado — próximo run detectará cambios")
              else:
                  nuevos_norm   = panel_ahora_norm - panel_prev_norm
                  perdidos_norm = panel_prev_norm  - panel_ahora_norm

                  # Filtrar los que ya estaban en sectores_iniciales
                  a_alertar_norm = {n for n in nuevos_norm if n not in si_norm}

                  print(f"  A alertar: {sorted(a_alertar_norm) or 'ninguno'}")

                  if a_alertar_norm:
                      prueba_tag = " <i>(PRUEBA)</i>" if SECTOR_PRUEBA else ""
                      def _fmt(n_norm):
                          orig = norm_a_orig.get(n_norm, n_norm)
                          prefix = "⭐ " if any(d in n_norm for d in DESTACADOS) else "🎟 "
                          return f"  {prefix}<b>{orig}</b>"
                      lista = "\n".join(_fmt(n) for n in sorted(a_alertar_norm))
                      send_telegram(
                          f"🚨 <b>¡Disponible!{prueba_tag}</b>\n"
                          f"<b>{nombre}</b>\n\n"
                          f"{lista}\n\n"
                          f"⚡ Compra AHORA:\n{url}\n\n"
                          f"🕐 {hora_scl.strftime('%H:%M')} Santiago"
                      )
                      print("  🚨 ALERTA enviada.")
                  else:
                      print("  ✅ Sin cambios.")

                  if perdidos_norm:
                      print(f"  ℹ️  Perdidos (sin alerta): {sorted(perdidos_norm)}")

              # Guardar estado con nombres normalizados (para comparación robusta)
              # y originales (para mensajes legibles)
              if fecha_agotado:
                  norm_guardar = panel_ahora_norm
                  orig_guardar = [norm_a_orig.get(n, n) for n in norm_guardar]
              else:
                  if sectores_raw:
                      norm_guardar = panel_ahora_norm
                      orig_guardar = [norm_a_orig.get(n, n) for n in norm_guardar]
                  else:
                      norm_guardar = panel_prev_norm
                      orig_guardar = list(nombre_orig_prev.values())

              estado_nuevo[eid] = {
                  "sectores_panel": orig_guardar,
                  "sectores_norm":  list(norm_guardar),
                  "primer_check":   primer_check,
                  "ultimo_check":   ahora_utc.isoformat(),
              }

          guardar_estado(estado_nuevo)
          print(f"\n{'='*55}\n  ✅ Listo.\n{'='*55}")
          PYEOF

      - name: 💾 Guardar estado
        uses: actions/cache/save@v4
        if: always()
        with:
          path: estado_previo.json
          key: tm-estado2-${{ github.run_id }}
