name: 🤘 Iron Maiden — Pacífico Medio × 2

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch: {}

jobs:
  check-pacifico-medio:
    name: Verificar 2 entradas Pacífico Medio
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: 📂 Restaurar estado previo
        uses: actions/cache/restore@v4
        with:
          path: estado_pm.json
          key: pm-estado-${{ github.run_id }}
          restore-keys: pm-estado-

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Instalar dependencias
        run: pip install requests --break-system-packages 2>/dev/null || pip install requests

      - name: 🔍 Chequear Pacífico Medio ×2
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 << 'PYEOF'
          import os, json, re, requests
          from datetime import datetime, timezone, timedelta

          TELEGRAM_TOKEN   = os.environ.get("TELEGRAM_TOKEN", "")
          TELEGRAM_CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID", "")
          URL_EVENTO = "https://www.ticketmaster.cl/event/iron-maiden-run-for-your-lives-scl-2026-venta-general"

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/124.0.0.0 Safari/537.36"
              ),
              "Accept-Language": "es-CL,es;q=0.9",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
          }

          def send_telegram(msg):
              if not TELEGRAM_TOKEN or not TELEGRAM_CHAT_ID:
                  print("  sin credenciales Telegram")
                  return
              try:
                  r = requests.post(
                      f"https://api.telegram.org/bot{TELEGRAM_TOKEN}/sendMessage",
                      json={"chat_id": TELEGRAM_CHAT_ID, "text": msg,
                            "parse_mode": "HTML", "disable_web_page_preview": True},
                      timeout=10)
                  r.raise_for_status()
                  print("  Telegram OK")
              except Exception as e:
                  print(f"  Telegram error: {e}")

          def cargar_estado():
              if os.path.exists("estado_pm.json"):
                  try:
                      with open("estado_pm.json") as f:
                          return json.load(f)
                  except Exception:
                      pass
              return {}

          def guardar_estado(data):
              with open("estado_pm.json", "w") as f:
                  json.dump(data, f)

          def extraer_sector(html, nombre_sector):
              """
              Extrae el bloque JSON del sector buscado del HTML SSR de Ticketmaster.
              Retorna dict con availability y max, o None si no encontrado.
              """
              # Buscar el campo "name":"<sector>" en el JSON embebido
              idx = html.find(f'"name":"{nombre_sector}"')
              if idx == -1:
                  return None

              # Caminar hacia atrás para encontrar el inicio del objeto del sector {
              # Buscamos el último '{' antes del "id": que precede al "name"
              inicio = html.rfind('{', 0, idx)
              if inicio == -1:
                  return None

              # Balancear llaves para extraer el objeto JSON completo
              depth = 0
              for i in range(inicio, len(html)):
                  c = html[i]
                  if c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          json_str = html[inicio:i+1]
                          try:
                              return json.loads(json_str)
                          except json.JSONDecodeError:
                              # Intentar con el siguiente '{'
                              siguiente = html.find(f'"name":"{nombre_sector}"', idx + 1)
                              if siguiente != -1:
                                  inicio2 = html.rfind('{', 0, siguiente)
                                  if inicio2 != -1 and inicio2 != inicio:
                                      return extraer_sector_desde(html, nombre_sector, inicio2)
                              return None
              return None

          # ══════════════════════════════════════
          ahora_utc = datetime.now(timezone.utc)
          hora_scl  = ahora_utc - timedelta(hours=4)

          print("=" * 55)
          print(f"  Iron Maiden Pacifico Medio x2 — {hora_scl.strftime('%H:%M')} Santiago")
          print("=" * 55)

          # PASO 1: Descargar HTML
          print("PASO 1: Descargando pagina...")
          try:
              resp = requests.get(URL_EVENTO, headers=HEADERS, timeout=30)
              html = resp.text
              print(f"PASO 1: OK — {len(html)} chars (status {resp.status_code})")
          except Exception as e:
              print(f"PASO 1: ERROR — {e}")
              guardar_estado({"error": str(e), "ultimo_check": ahora_utc.isoformat()})
              exit(0)

          # Verificar que tenemos contenido real (no una pagina de error)
          if len(html) < 50000:
              print(f"PASO 1: ADVERTENCIA — HTML demasiado corto ({len(html)} chars), posible bloqueo")
              print(f"  Fragmento: {html[:300]}")
              guardar_estado({"error": "HTML corto", "largo": len(html), "ultimo_check": ahora_utc.isoformat()})
              exit(0)

          # PASO 2: Buscar sector Pacifico Medio
          print("PASO 2: Buscando sector Pacifico Medio...")
          sector = extraer_sector(html, "Pacifico Medio")

          if sector is None:
              print("PASO 2: Pacifico Medio NO encontrado en el HTML")
              print("  (puede estar agotado o la pagina cambio)")
              guardar_estado({
                  "disponible": False, "dos": False,
                  "detalle": "No encontrado en HTML",
                  "ultimo_check": ahora_utc.isoformat()
              })
              print("=" * 55)
              exit(0)

          print(f"PASO 2: Sector encontrado!")
          print(f"  id={sector.get('id')}, available={sector.get('available')}")

          # PASO 3: Revisar disponibilidad
          print("PASO 3: Analizando disponibilidad...")
          availability = 0
          max_tickets  = 0
          precio       = 0

          rates = sector.get("rates", [])
          if rates:
              rate = rates[0]  # Tomar la primera tarifa (Normal)
              availability = rate.get("availability", 0)
              max_tickets  = rate.get("max", 0)
              precio       = rate.get("price", 0)
              print(f"  Tarifa: {rate.get('name')} — availability={availability}, max={max_tickets}, price={precio}")
          else:
              # Sin rates, verificar campo available del sector
              disponible_bool = sector.get("available", False)
              print(f"  Sin rates. available={disponible_bool}")
              availability = 1 if disponible_bool else 0
              max_tickets  = 1

          disponible = availability >= 1
          dos_juntas  = availability >= 2 and max_tickets >= 2

          print(f"  Disponible: {disponible} | Dos juntas: {dos_juntas}")

          # PASO 4: Decidir alerta
          estado_anterior = cargar_estado()
          ya_alertado = estado_anterior.get("alertado_dos", False)

          if dos_juntas:
              precio_fmt = f"${precio:,}".replace(",", ".") if precio else "?"
              msg = (
                  f"🔥 <b>IRON MAIDEN — PACÍFICO MEDIO × 2 DISPONIBLES</b>\n\n"
                  f"Hay <b>{availability} entradas juntas</b> en Pacífico Medio\n"
                  f"Precio: {precio_fmt} CLP por entrada\n\n"
                  f"⚡ <b>COMPRA AHORA:</b>\n{URL_EVENTO}\n\n"
                  f"🕐 {hora_scl.strftime('%H:%M')} Santiago"
              )
              if not ya_alertado:
                  send_telegram(msg)
                  print("  ALERTA ENVIADA: 2 entradas disponibles!")
              else:
                  print("  (ya alertado antes, silencio)")
          elif disponible:
              print(f"  Sin alerta — solo {availability} entrada(s) disponible(s) (max={max_tickets}), esperando 2 juntas")
              if ya_alertado:
                  # Reset: ya no hay 2, limpiar flag
                  print("  (reseteando flag alertado)")
          else:
              print("  Sin alerta — Pacifico Medio agotado")
              if ya_alertado:
                  print("  (reseteando flag alertado)")

          guardar_estado({
              "disponible":    disponible,
              "dos":           dos_juntas,
              "availability":  availability,
              "max":           max_tickets,
              "alertado_dos":  dos_juntas and (ya_alertado or dos_juntas),
              "detalle":       f"availability={availability}, max={max_tickets}",
              "ultimo_check":  ahora_utc.isoformat(),
          })
          print("=" * 55)
          PYEOF

      - name: 💾 Guardar estado
        uses: actions/cache/save@v4
        if: always()
        with:
          path: estado_pm.json
          key: pm-estado-${{ github.run_id }}
