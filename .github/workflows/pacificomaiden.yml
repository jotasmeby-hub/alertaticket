name: 🤘 Foo Fighters — Cambios de Sectores

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch: {}

jobs:
  check-foofighters:
    name: Verificar sectores Foo Fighters
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: 📂 Restaurar estado previo
        uses: actions/cache/restore@v4
        with:
          path: estado_ff.json
          key: ff-estado-${{ github.run_id }}
          restore-keys: ff-estado-

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Instalar dependencias
        run: pip install requests --break-system-packages 2>/dev/null || pip install requests

      - name: 🔍 Chequear sectores Foo Fighters
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPERAPI_KEY:   ${{ secrets.SCRAPERAPI_KEY }}
        run: |
          python3 << 'PYEOF'
          import os, json, re, requests, unicodedata
          from datetime import datetime, timezone, timedelta

          TELEGRAM_TOKEN   = os.environ.get("TELEGRAM_TOKEN", "")
          TELEGRAM_CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID", "")
          SCRAPERAPI_KEY   = os.environ.get("SCRAPERAPI_KEY", "")
          URL_EVENTO = "https://www.ticketmaster.cl/event/foo-fighters-live-2027-scl-venta-general"

          # ── helpers ──────────────────────────────────────────────────────────

          def get_html(url):
              if not SCRAPERAPI_KEY:
                  raise Exception("SCRAPERAPI_KEY no configurada")
              api_url = f"http://api.scraperapi.com?api_key={SCRAPERAPI_KEY}&url={url}&render=false"
              resp = requests.get(api_url, timeout=60)
              print(f"  ScraperAPI: status={resp.status_code}, largo={len(resp.text)}")
              return resp.text, resp.status_code

          def send_telegram(msg):
              if not TELEGRAM_TOKEN or not TELEGRAM_CHAT_ID:
                  print("  sin credenciales Telegram")
                  return
              try:
                  r = requests.post(
                      f"https://api.telegram.org/bot{TELEGRAM_TOKEN}/sendMessage",
                      json={"chat_id": TELEGRAM_CHAT_ID, "text": msg,
                            "parse_mode": "HTML", "disable_web_page_preview": True},
                      timeout=10)
                  r.raise_for_status()
                  print("  Telegram OK")
              except Exception as e:
                  print(f"  Telegram error: {e}")

          def normalizar(texto):
              t = unicodedata.normalize("NFKD", texto.lower())
              return "".join(c for c in t if not unicodedata.combining(c)).strip()

          def extraer_todos_sectores(html):
              """
              Extrae todos los sectores del JSON SSR de Ticketmaster.
              Retorna lista de dicts: {"name": str, "available": bool, "availability": int, "price": int}
              """
              # Buscar el array "sectors":[...] en el HTML
              idx = html.find('"sectors":')
              if idx == -1:
                  return []

              # Buscar el '[' que abre el array
              inicio_arr = html.find('[', idx)
              if inicio_arr == -1:
                  return []

              # Balancear corchetes para extraer el array completo
              depth = 0
              for i in range(inicio_arr, len(html)):
                  c = html[i]
                  if c == '[':
                      depth += 1
                  elif c == ']':
                      depth -= 1
                      if depth == 0:
                          arr_str = html[inicio_arr:i+1]
                          try:
                              sectores_raw = json.loads(arr_str)
                          except json.JSONDecodeError:
                              return []
                          break
              else:
                  return []

              resultado = []
              for s in sectores_raw:
                  nombre = s.get("name", "")
                  if not nombre:
                      continue
                  available = s.get("available", False)
                  rates = s.get("rates", [])
                  avail_count = 0
                  precio = 0
                  if rates:
                      avail_count = rates[0].get("availability", 0)
                      precio = rates[0].get("price", 0)

                  resultado.append({
                      "name":         nombre,
                      "available":    available or avail_count > 0,
                      "availability": avail_count,
                      "price":        precio,
                  })

              return resultado

          def cargar_estado():
              if os.path.exists("estado_ff.json"):
                  try:
                      with open("estado_ff.json") as f:
                          return json.load(f)
                  except Exception:
                      pass
              return {}

          def guardar_estado(data):
              with open("estado_ff.json", "w") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)

          # ── main ─────────────────────────────────────────────────────────────

          ahora_utc = datetime.now(timezone.utc)
          hora_scl  = ahora_utc - timedelta(hours=4)

          print("=" * 55)
          print(f"  Foo Fighters — {hora_scl.strftime('%H:%M')} Santiago")
          print("=" * 55)

          # PASO 1: Descargar HTML
          print("PASO 1: Descargando pagina...")
          try:
              html, status = get_html(URL_EVENTO)
              print(f"PASO 1: OK — {len(html)} chars (status {status})")
          except Exception as e:
              print(f"PASO 1: ERROR — {e}")
              exit(0)

          if len(html) < 50000:
              print(f"PASO 1: ADVERTENCIA — HTML corto ({len(html)} chars), posible bloqueo")
              print(f"  Fragmento: {html[:300]}")
              exit(0)

          # PASO 2: Extraer sectores
          print("PASO 2: Extrayendo sectores...")
          sectores_ahora = extraer_todos_sectores(html)

          if not sectores_ahora:
              print("PASO 2: No se encontraron sectores en el HTML")
              exit(0)

          print(f"PASO 2: {len(sectores_ahora)} sectores encontrados:")
          for s in sectores_ahora:
              estado_txt = "DISPONIBLE" if s["available"] else "agotado"
              precio_fmt = f"${s['price']:,}".replace(",", ".") if s["price"] else "?"
              print(f"  - {s['name']}: {estado_txt} (availability={s['availability']}, precio={precio_fmt})")

          # PASO 3: Comparar con estado anterior
          print("PASO 3: Comparando con estado anterior...")
          estado_anterior = cargar_estado()

          # Construir mapa nombre_normalizado → sector
          mapa_ahora = {normalizar(s["name"]): s for s in sectores_ahora}
          mapa_prev  = {normalizar(k): v for k, v in estado_anterior.get("sectores", {}).items()}

          es_baseline = not bool(mapa_prev)

          if es_baseline:
              print("PASO 3: Primera corrida — guardando baseline sin alertar")
              print(f"  Estado inicial: {len(mapa_ahora)} sectores")
          else:
              cambios = []

              # Sectores nuevos que no estaban antes
              for norm, s in mapa_ahora.items():
                  if norm not in mapa_prev:
                      cambios.append(f"🆕 Nuevo sector: <b>{s['name']}</b>")

              # Sectores que desaparecieron
              for norm, s_prev in mapa_prev.items():
                  if norm not in mapa_ahora:
                      cambios.append(f"❌ Sector desaparecido: <b>{s_prev['name']}</b>")

              # Sectores que cambiaron de estado (disponible ↔ agotado)
              for norm, s in mapa_ahora.items():
                  if norm in mapa_prev:
                      prev = mapa_prev[norm]
                      prev_avail = prev.get("available", False)
                      ahora_avail = s["available"]
                      if prev_avail != ahora_avail:
                          if ahora_avail:
                              precio_fmt = f"${s['price']:,}".replace(",", ".") if s["price"] else "?"
                              cambios.append(f"✅ <b>{s['name']}</b> → DISPONIBLE ({precio_fmt} CLP)")
                          else:
                              cambios.append(f"🔴 <b>{s['name']}</b> → agotado")

              print(f"PASO 3: {len(cambios)} cambio(s) detectado(s)")

              if cambios:
                  lista_cambios = "\n".join(cambios)
                  # Resumen del estado actual
                  disponibles = [s["name"] for s in sectores_ahora if s["available"]]
                  agotados    = [s["name"] for s in sectores_ahora if not s["available"]]
                  resumen = f"\nEstado actual:\n✅ Disponibles ({len(disponibles)}): {', '.join(disponibles) or 'ninguno'}\n🔴 Agotados ({len(agotados)}): {', '.join(agotados) or 'ninguno'}"

                  msg = (
                      f"🤘 <b>FOO FIGHTERS 2027 — CAMBIO DE SECTORES</b>\n\n"
                      f"{lista_cambios}\n"
                      f"{resumen}\n\n"
                      f"⚡ <b>REVISA ACÁ:</b>\n{URL_EVENTO}\n\n"
                      f"🕐 {hora_scl.strftime('%H:%M')} Santiago"
                  )
                  send_telegram(msg)
                  print("  ALERTA ENVIADA!")
              else:
                  print("  Sin cambios — todo igual")

          # PASO 4: Guardar estado actual
          guardar_estado({
              "sectores": {
                  s["name"]: {
                      "name":         s["name"],
                      "available":    s["available"],
                      "availability": s["availability"],
                      "price":        s["price"],
                  }
                  for s in sectores_ahora
              },
              "ultimo_check": ahora_utc.isoformat(),
          })
          print("=" * 55)
          PYEOF

      - name: 💾 Guardar estado
        uses: actions/cache/save@v4
        if: always()
        with:
          path: estado_ff.json
          key: ff-estado-${{ github.run_id }}
